<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <input type="text" class="input" />
        <div class="actions">
            <button data-btn="add">Add task</button>
            <button data-btn="delete">Delete completed</button>
        </div>
        <form class="search-form hidden" action="submit">
            <input type="text" placeholder="Search" />
            <button type="submit">Search</button>
            <button type="reset">Reset</button>
            <p class="hidden message">No task found</p>
        </form>
        <div class="sorting">
            <label for="task-sorting">Sort by:</label>
            <select name="tasks" id="task-sorting">
                <option value="">Choose option</option>
                <option value="newest">Newest first</option>
                <option value="oldest">Oldest first</option>
                <option value="az">A → Z</option>
                <option value="za">Z → A</option>
            </select>
        </div>
        <ul class="counter">
            <li>
                Total:
                <span class="total-count">0</span>
            </li>
            <li>
                Active:
                <span class="active-count">0</span>
            </li>
            <li>
                Completed:
                <span class="completed-count">0</span>
            </li>
        </ul>
        <div>
            <div class="filters">
                <h2>Filter</h2>
                <button data-filter="all">All</button>
                <button data-filter="active">Active</button>
                <button data-filter="completed">Completed</button>
            </div>
        </div>

        <ul class="list"></ul>
        <script src="todo-localStorage.js" type="module"></script>
    </body>
</html>
